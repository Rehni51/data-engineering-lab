name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Code quality and tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: datauser
      POSTGRES_PASSWORD: datapassword
      POSTGRES_DB: datalab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest

      - name: Validate dbt project
        run: >
          uv run dbt parse
          --project-dir dbt
          --profiles-dir dbt

      - name: Validate Airflow DAG syntax
        run: >
          uv run python
          -m py_compile
          airflow/dags/weather_pipeline.py